name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/divination-site-prototype-ycny6v
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp asset version for cache busting
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Pages側の一時エラー("Deployment failed, try again later")対策のリトライ
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 70

      - name: Deploy (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # カスタムドメイン設定(Settings→Pages→Custom domain と同じ操作をAPIで実施)
      # 注: GITHUB_TOKEN では cname を変更できない(403)ため、
      #     リポジトリシークレット PAGES_ADMIN_TOKEN(fine-grained PAT / Pages: write)
      #     があるときだけ実行する。なければスキップ=手動設定が必要。
      - name: Set custom domain
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PAGES_ADMIN_TOKEN 未設定のためカスタムドメインは自動設定されません。Settings→Pages→Custom domain に myouriscope.com を手動入力してください。"
            exit 0
          fi
          current=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("cname") or "")')
          echo "current cname: '$current'"
          if [ "$current" != "myouriscope.com" ]; then
            code=$(curl -s -o /tmp/pages_put.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"cname":"myouriscope.com"}')
            echo "PUT cname -> HTTP $code"; cat /tmp/pages_put.json
            [ "$code" = "204" ] || [ "$code" = "200" ] || exit 1
          else
            echo "custom domain already set"
          fi
          # 証明書発行済みならHTTPS強制もオンにする(未発行なら422で来る=後続デプロイで再試行)
          code=$(curl -s -o /tmp/pages_https.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"https_enforced":true}')
          echo "PUT https_enforced -> HTTP $code (422なら証明書待ち・問題なし)"
